<adm-data-grid
  [columns]="columns"
  [data]="inquiries()"
  searchPlaceholder="검색어를 입력하세요"
  [contextMenuItemsFn]="getContextMenuItems"
  (contextMenuSelect)="onContextMenu($event)"
  (rowClick)="onRowClick($event)">
</adm-data-grid>

<!-- 삭제 확인 다이얼로그 -->
@if (showDeleteDialog()) {
  <adm-confirm-dialog
    title="문의 삭제"
    message="해당 문의를 삭제하시겠습니까?\n삭제 후 되돌릴 수 없습니다."
    confirmText="삭제"
    [details]="deleteDialogDetails()"
    (confirm)="onDeleteConfirm()"
    (cancel)="onDeleteCancel()">
  </adm-confirm-dialog>
}

<!-- ===== 답변 드로어 ===== -->
@if (drawerOpen() && drawerTarget()) {
  <div class="fixed inset-0 z-50 flex justify-end"
       role="dialog" aria-modal="true"
       (click)="closeDrawer()"
       (keydown.escape)="closeDrawer()">
    <div class="flex flex-col items-start p-6 gap-6 bg-white drawer-slide-in"
         style="width: 522px; border-radius: 6px 0 0 6px;"
         role="document"
         (click)="$event.stopPropagation()">

      <!-- 닫기 버튼 -->
      <div class="flex items-start w-full">
        <button class="flex items-center justify-center p-1.5 rounded-md border-none bg-transparent cursor-pointer"
                (click)="closeDrawer()">
          <span class="font-suit font-bold text-base text-gray-700">&gt;&gt;</span>
        </button>
      </div>

      <!-- 타이틀 -->
      <div class="flex items-center gap-6 w-full">
        <h4 class="font-suit font-bold text-2xl leading-[150%] tracking-[-0.04em] text-gray-700 m-0">1:1 문의 답변</h4>
      </div>

      <!-- 문의 정보 -->
      <div class="flex flex-col gap-4 w-full p-4 bg-gray-50 rounded-lg">
        <div class="flex items-center gap-3">
          <span class="flex justify-center items-center px-2 py-0.5 rounded-md text-xs font-suit font-medium leading-[150%] tracking-tight border"
                [ngClass]="drawerTarget()?.status === '대기' ? 'bg-amber-50 border-amber-300 text-amber-600' : 'bg-emerald-50 border-emerald-300 text-emerald-600'">
            {{ drawerTarget()?.status }}
          </span>
          <span class="font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-500">{{ drawerTarget()?.createdAt }}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-500">작성자</span>
          <span class="font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-800">{{ drawerTarget()?.author }}</span>
        </div>
        <h5 class="font-suit font-bold text-base leading-[150%] tracking-[-0.04em] text-gray-800 m-0">{{ drawerTarget()?.title }}</h5>
        <p class="font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-600 m-0">{{ drawerTarget()?.content }}</p>
      </div>

      <!-- 구분선 -->
      <div class="w-full h-0 border-t border-gray-200"></div>

      <!-- 답변 입력 -->
      <div class="flex flex-col gap-2 w-full flex-1">
        <div class="flex items-center gap-0.5">
          <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-700">답변</span>
          <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#3C8EEE]">*</span>
        </div>
        <textarea class="w-full flex-1 min-h-[200px] px-4 py-3 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#1E293B] outline-none focus:border-[#3C8EEE] transition-colors resize-none"
                  placeholder="답변을 입력하세요"
                  [value]="drawerReply()"
                  (input)="updateReply($any($event.target).value)"
                  style="box-sizing: border-box;"></textarea>
      </div>

      <!-- 답변 등록 버튼 -->
      <div class="flex flex-col justify-end items-center w-full">
        <button class="flex items-center justify-center w-full h-10 bg-[#3C8EEE] rounded-md border-none cursor-pointer hover:bg-blue-600 transition-colors font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white"
                (click)="submitReply()">
          답변 등록
        </button>
      </div>

    </div>
  </div>
}
