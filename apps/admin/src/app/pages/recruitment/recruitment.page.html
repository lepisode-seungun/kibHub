<!-- 탭 세그먼트 -->
<div class="flex items-start w-full border-b border-gray-100">
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'intro'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'intro'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('intro')">
    부트캠프 소개
  </button>
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'curriculum'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'curriculum'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('curriculum')">
    커리큘럼
  </button>
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'instructor'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'instructor'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('instructor')">
    강사소개
  </button>
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'review'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'review'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('review')">
    부트캠프 후기
  </button>
</div>

<!-- 콘텐츠 영역 -->
<div class="flex flex-col p-6 gap-2.5 flex-1">

  @if (activeTab() === 'intro') {
    <adm-text-editor
      [content]="introContent()"
      (contentChange)="introContent.set($event)"
      minHeight="326px"
      placeholder="부트캠프 소개 내용을 입력하세요">
    </adm-text-editor>
    <div class="flex justify-end mt-2">
      <button class="flex items-center justify-center px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors disabled:opacity-50"
              style="width: 52px; height: 40px;"
              [disabled]="isSaving()"
              (click)="saveCurrentTab()">
        저장
      </button>
    </div>
  }

  @if (activeTab() === 'curriculum') {
    <adm-text-editor
      [content]="curriculumContent()"
      (contentChange)="curriculumContent.set($event)"
      minHeight="326px"
      placeholder="커리큘럼 내용을 입력하세요">
    </adm-text-editor>
    <div class="flex justify-end mt-2">
      <button class="flex items-center justify-center px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors disabled:opacity-50"
              style="width: 52px; height: 40px;"
              [disabled]="isSaving()"
              (click)="saveCurrentTab()">
        저장
      </button>
    </div>
  }

  @if (activeTab() === 'review') {
    <div class="relative w-full mb-2">
      <select class="w-full h-10 px-4 py-2 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 outline-none appearance-none cursor-pointer focus:border-[#3C8EEE] transition-colors"
              style="padding-right: 40px;"
              [value]="reviewVisibility()"
              (change)="reviewVisibility.set($any($event.target).value)">
        <option value="" disabled>선택하세요</option>
        <option value="show">노출</option>
        <option value="hide">숨김</option>
      </select>
      <svg class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 6L15 12L9 18" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <adm-text-editor
      [content]="reviewContent()"
      (contentChange)="reviewContent.set($event)"
      minHeight="326px"
      placeholder="부트캠프 후기 내용을 입력하세요">
    </adm-text-editor>
    <div class="flex justify-end mt-2">
      <button class="flex items-center justify-center px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors disabled:opacity-50"
              style="width: 52px; height: 40px;"
              [disabled]="isSaving() || !reviewVisibility()"
              (click)="saveCurrentTab()">
        저장
      </button>
    </div>
  }

  @if (activeTab() === 'instructor') {
    <!-- 검색바 + 등록 버튼 한 줄 -->
    <div class="flex items-center justify-between mb-4">
      <div class="relative flex items-center">
        <svg class="absolute left-3" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M7.333 12.667A5.333 5.333 0 107.333 2a5.333 5.333 0 000 10.667zM14 14l-2.9-2.9" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="text"
               class="pl-9 pr-4 py-2 w-[280px] h-10 bg-white border border-gray-300 rounded-md font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-700 placeholder:text-gray-400 outline-none focus:border-[#3C8EEE] transition-colors"
               placeholder="검색어를 입력하세요" />
      </div>
      <button class="flex items-center justify-center gap-1 px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors"
              style="height: 40px;"
              (click)="openInstructorDrawer()">
        <span>+</span>
        <span>등록</span>
      </button>
    </div>
    <adm-data-grid
      [columns]="instructorColumns"
      [data]="instructorData()"
      [showSearch]="false"
      [contextMenuItems]="['수정', '삭제']"
      (rowClick)="editInstructor(instructorData().indexOf($event))"
      (contextMenuSelect)="onInstructorContextMenu($event)">
    </adm-data-grid>
  }

</div>

<!-- ===== 강사등록 사이드 드로어 ===== -->
@if (instructorDrawerOpen()) {
  <div class="fixed inset-0 bg-black/30 z-[998] drawer-overlay"
       role="button" tabindex="0" aria-label="드로어 닫기"
       (click)="closeInstructorDrawer()"
       (keydown.enter)="closeInstructorDrawer()"></div>

  <div class="fixed top-0 right-0 z-[999] flex flex-col p-6 gap-6 bg-white h-full overflow-y-auto drawer-panel"
       style="width: 522px; border-radius: 6px 0 0 6px;">

    <!-- 닫기 버튼 -->
    <button class="flex items-center p-1.5 rounded-md bg-transparent border-none cursor-pointer"
            (click)="closeInstructorDrawer()">
      <svg width="19" height="16" viewBox="0 0 19 16" fill="none">
        <path d="M12 1L18 8L12 15M6 1L12 8L6 15" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 타이틀 -->
    <span class="font-suit font-bold text-2xl leading-[150%] tracking-[-0.04em] text-gray-700">{{ isEditMode ? '강사수정' : '강사등록' }}</span>

    <!-- 썸네일 섹션 -->
    <adm-image-upload
      label="썸네일"
      [required]="true"
      hint="권장 사이즈 400px * 500px"
      [existingUrl]="instructorExistingPhoto()"
      (fileChange)="onInstructorImageChange($event)">
    </adm-image-upload>

    <!-- 이름 -->
    <div class="flex flex-col gap-2 w-full">
      <div class="flex items-center gap-0.5">
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-700">이름</span>
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#3C8EEE]">*</span>
      </div>
      <input type="text"
             class="w-full px-4 py-2 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 outline-none focus:border-[#3C8EEE] transition-colors box-border"
             style="height: 40px;"
             [value]="instructorName()"
             (input)="instructorName.set($any($event.target).value)"
             placeholder="이름을 입력하세요" />
    </div>

    <!-- 요약설명 -->
    <div class="flex flex-col gap-2 w-full">
      <div class="flex items-center gap-0.5">
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-700">요약설명</span>
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#3C8EEE]">*</span>
      </div>
      <input type="text"
             class="w-full px-4 py-2 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 outline-none focus:border-[#3C8EEE] transition-colors box-border"
             style="height: 40px;"
             [value]="instructorSummary()"
             (input)="instructorSummary.set($any($event.target).value)"
             placeholder="요약설명을 입력하세요" />
    </div>

    <!-- 대표작 (뱃지 라벨) -->
    <div class="flex flex-col gap-2 w-full">
      <div class="flex items-center gap-0.5">
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-700">대표작</span>
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#3C8EEE]">*</span>
      </div>
      <input type="text"
             class="w-full px-4 py-2 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 outline-none focus:border-[#3C8EEE] transition-colors box-border"
             style="height: 40px;"
             [value]="instructorBadge()"
             (input)="instructorBadge.set($any($event.target).value)"
             placeholder="예: 대표작"
             maxlength="10" />
      <div class="flex justify-end">
        <span class="font-suit font-medium text-sm leading-[150%] tracking-[-0.04em] text-gray-400">{{ instructorBadge().length }} / 10</span>
      </div>
    </div>

    <!-- 대표작 내용 -->
    <div class="flex flex-col gap-2 w-full">
      <div class="flex items-center gap-0.5">
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-700">대표작 내용</span>
        <span class="font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-[#3C8EEE]">*</span>
      </div>
      <input type="text"
             class="w-full px-4 py-2 bg-white border-2 border-gray-300 rounded-md font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 outline-none focus:border-[#3C8EEE] transition-colors box-border"
             style="height: 40px;"
             [value]="instructorWork()"
             (input)="instructorWork.set($any($event.target).value)"
             placeholder="대표작 내용을 입력하세요" />
    </div>

    <!-- 하단 등록/수정 버튼 -->
    <div class="flex flex-col flex-1 justify-end">
      <button class="flex items-center justify-center w-full h-10 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors"
              (click)="submitInstructor()">
        {{ isEditMode ? '수정' : '등록' }}
      </button>
    </div>
  </div>
}
