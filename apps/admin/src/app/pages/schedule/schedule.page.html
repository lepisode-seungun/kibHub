<!-- 탭 세그먼트 -->
<div class="flex items-start w-full border-b border-gray-100">
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'schedule'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'schedule'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('schedule')">
    이용약관
  </button>
  <button class="flex items-center justify-center px-4 py-3 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] cursor-pointer transition-colors"
          [ngClass]="activeTab() === 'management'
            ? 'text-[#3C8EEE] bg-white font-semibold'
            : 'text-[#71717A] bg-[#F9FAFB] hover:text-gray-600'"
          [ngStyle]="activeTab() === 'management'
            ? { 'border-bottom': '2px solid #3C8EEE', 'margin-bottom': '-2px', 'border-top': 'none', 'border-left': 'none', 'border-right': 'none' }
            : { 'border': 'none' }"
          (click)="setTab('management')">
    개인정보처리방침
  </button>
</div>

<!-- 콘텐츠 영역 -->
<div class="flex flex-col p-6 gap-2.5 flex-1">

  @if (activeTab() === 'schedule') {
    <!-- 이용약관 에디터 영역 -->
    <div class="flex flex-col w-full border border-gray-300 rounded-lg overflow-hidden">
      <!-- 에디터 툴바 -->
      <div class="flex items-start p-3 gap-4 bg-gray-50 border-b border-gray-100" style="border-radius: 8px 8px 0 0;">
        <!-- 폰트 드롭다운 -->
        <button class="flex items-center gap-1 bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 15h3l1-3h6l1 3h3L11 3H9L3 15zm5.5-5L10 6l1.5 4H8.5z" fill="#6B7280"/>
          </svg>
          <svg width="8" height="5" viewBox="0 0 8 5" fill="none">
            <path d="M1 1l3 3 3-3" stroke="#8A9099" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Italic -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M8 3h6M6 17h6M10 3L8 17" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Bold -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 3h5.5a3.5 3.5 0 0 1 0 7H5V3zm0 7h6.5a3.5 3.5 0 0 1 0 7H5v-7z" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <!-- Underline -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 3v6a5 5 0 0 0 10 0V3M3 18h14" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Link -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M8.5 12.5l3-3M7 14l-1.5 1.5a2.12 2.12 0 0 1-3-3L4 11M13 9l1.5-1.5a2.12 2.12 0 0 0-3-3L10 6" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- Emoji -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="7.5" stroke="#6B7280" stroke-width="1.5"/>
            <circle cx="7.5" cy="8.5" r="1" fill="#6B7280"/>
            <circle cx="12.5" cy="8.5" r="1" fill="#6B7280"/>
            <path d="M7 12.5a3.5 3.5 0 0 0 6 0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </button>
        <!-- List -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M6 5h11M6 10h11M6 15h11" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="3" cy="5" r="1" fill="#6B7280"/>
            <circle cx="3" cy="10" r="1" fill="#6B7280"/>
            <circle cx="3" cy="15" r="1" fill="#6B7280"/>
          </svg>
        </button>
        <!-- Image -->
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="3" width="16" height="14" rx="2" stroke="#6B7280" stroke-width="1.5"/>
            <circle cx="7" cy="8" r="1.5" stroke="#6B7280" stroke-width="1"/>
            <path d="M2 14l4-4 3 3 3-3 6 4" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <!-- 에디터 본문 -->
      <textarea class="w-full border-none outline-none resize-none p-4 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 bg-white box-border"
                style="min-height: 326px;"
                placeholder="이용약관 내용을 입력하세요"
                [value]="termsContent()"
                (input)="updateTermsContent($event)"></textarea>
    </div>
    <!-- 저장 버튼 -->
    <div class="flex justify-end mt-2">
      <button class="flex items-center justify-center px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors disabled:opacity-50"
              style="width: 52px; height: 40px;"
              [disabled]="isSaving()"
              (click)="saveTerms()">
        저장
      </button>
    </div>
  }

  @if (activeTab() === 'management') {
    <!-- 개인정보처리방침 에디터 영역 -->
    <div class="flex flex-col w-full border border-gray-300 rounded-lg overflow-hidden">
      <div class="flex items-start p-3 gap-4 bg-gray-50 border-b border-gray-100" style="border-radius: 8px 8px 0 0;">
        <button class="flex items-center gap-1 bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 15h3l1-3h6l1 3h3L11 3H9L3 15zm5.5-5L10 6l1.5 4H8.5z" fill="#6B7280"/></svg>
          <svg width="8" height="5" viewBox="0 0 8 5" fill="none"><path d="M1 1l3 3 3-3" stroke="#8A9099" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 3h6M6 17h6M10 3L8 17" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 3h5.5a3.5 3.5 0 0 1 0 7H5V3zm0 7h6.5a3.5 3.5 0 0 1 0 7H5v-7z" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 3v6a5 5 0 0 0 10 0V3M3 18h14" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8.5 12.5l3-3M7 14l-1.5 1.5a2.12 2.12 0 0 1-3-3L4 11M13 9l1.5-1.5a2.12 2.12 0 0 0-3-3L10 6" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="#6B7280" stroke-width="1.5"/><circle cx="7.5" cy="8.5" r="1" fill="#6B7280"/><circle cx="12.5" cy="8.5" r="1" fill="#6B7280"/><path d="M7 12.5a3.5 3.5 0 0 0 6 0" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 5h11M6 10h11M6 15h11" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/><circle cx="3" cy="5" r="1" fill="#6B7280"/><circle cx="3" cy="10" r="1" fill="#6B7280"/><circle cx="3" cy="15" r="1" fill="#6B7280"/></svg>
        </button>
        <button class="flex items-center bg-transparent border-none cursor-pointer p-0 opacity-80 hover:opacity-100 transition-opacity">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="#6B7280" stroke-width="1.5"/><circle cx="7" cy="8" r="1.5" stroke="#6B7280" stroke-width="1"/><path d="M2 14l4-4 3 3 3-3 6 4" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <textarea class="w-full border-none outline-none resize-none p-4 font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-gray-800 placeholder:text-gray-400 bg-white box-border"
                style="min-height: 326px;"
                placeholder="개인정보처리방침 내용을 입력하세요"
                [value]="privacyContent()"
                (input)="updatePrivacyContent($event)"></textarea>
    </div>
    <div class="flex justify-end mt-2">
      <button class="flex items-center justify-center px-3 py-2 bg-[#3C8EEE] border-none rounded-md cursor-pointer font-suit font-medium text-base leading-[150%] tracking-[-0.04em] text-white hover:bg-blue-600 transition-colors disabled:opacity-50"
              style="width: 52px; height: 40px;"
              [disabled]="isSaving()"
              (click)="savePrivacy()">
        저장
      </button>
    </div>
  }

</div>
