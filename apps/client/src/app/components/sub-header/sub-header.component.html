<nav class="w-full h-[60px] bg-bg-card border-b border-zinc-800 box-border" aria-label="카테고리 메뉴">
  <div class="flex items-center h-[60px] max-w-[1920px] mx-auto px-[238px] 2xl:px-[100px] xl:px-10 md:px-5 md:overflow-x-auto md:scrollbar-none">
    @for (tab of tabs; track tab.id) {
      <a
        [ngClass]="activeTabId() === tab.id ? 'nav-tab nav-tab--active' : 'nav-tab'"
        [routerLink]="tab.route"
      >
        <span class="font-suit font-semibold text-base leading-[18px] tracking-[-0.4px] whitespace-nowrap">{{ tab.label }}</span>
      </a>
    }
  </div>
</nav>
