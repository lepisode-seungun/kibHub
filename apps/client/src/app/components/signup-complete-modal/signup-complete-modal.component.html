            <div style="width: 0; height: 20px; border-left: 0.84px solid rgba(243,244,246,0.12);"></div>
            <div class="flex-1 flex flex-col items-start" style="gap: 3px;">
              <span class="font-suit font-bold text-white" style="font-size: 15px; line-height: 150%; letter-spacing: -0.04em;">0</span>
              <span class="font-suit font-medium text-[#71717A]" style="font-size: 12px; line-height: 150%; letter-spacing: -0.04em;">팔로워</span>
            </div>
            <div style="width: 0; height: 20px; border-left: 0.84px solid rgba(243,244,246,0.12);"></div>
            <div class="flex-1 flex flex-col items-start" style="gap: 3px;">
              <span class="font-suit font-bold text-white" style="font-size: 15px; line-height: 150%; letter-spacing: -0.04em;">0</span>
              <span class="font-suit font-medium text-[#71717A]" style="font-size: 12px; line-height: 150%; letter-spacing: -0.04em;">콘텐츠</span>

          <!-- 프로필 설정 버튼 -->
          <button class="w-full flex items-center justify-center cursor-pointer transition-opacity hover:opacity-90"

            (click)="goToProfile()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <span class="font-suit font-medium text-white" style="font-size: 12px; line-height: 150%; letter-spacing: -0.04em;">프로필 설정</span>
          </button>
          </div>

        </div>



        <!-- 확인 버튼 -->
        <button class="mt-4 w-[453px] max-w-full h-14 flex items-center justify-center bg-[#7A48FF] border-none rounded-xl cursor-pointer font-suit font-medium text-base leading-[150%] tracking-tight text-white transition-all duration-200 hover:bg-[#6B3CE6] active:scale-[0.99]"
          (click)="goToHome()">확인</button>
      </div>
    </div>
  </div>
