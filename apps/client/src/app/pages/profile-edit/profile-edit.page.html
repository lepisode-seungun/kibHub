<div class="flex flex-col">
  <main class="flex flex-col items-center px-[100px] py-20 gap-10 min-h-[calc(100vh-72px)] bg-[#151419] max-md:px-5 max-md:py-10">
    <!-- 상단 바 -->
    <div class="flex items-center gap-[172px] w-[500px] max-md:w-full max-md:gap-10">
      <button class="flex items-center justify-center w-6 h-6 bg-transparent border-none cursor-pointer p-0 transition-opacity duration-150 hover:opacity-60" (click)="goBack()" aria-label="뒤로 가기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15.77 3.77L14 2L4 12l10 10 1.77-1.77L7.54 12z" fill="#FFFFFF"/>
        </svg>
      </button>
      <h1 class="font-suit font-bold text-2xl leading-[150%] tracking-tight text-white m-0">프로필 편집</h1>
    </div>

    <!-- 폼 컨테이너 -->
    <div class="flex flex-col items-center gap-6 w-[500px] max-md:w-full">
      <!-- 아바타 -->
      <div class="group relative flex justify-center items-center w-[100px] h-[100px] bg-zinc-700 border border-zinc-600 rounded-full cursor-pointer isolate box-border" (click)="avatarInput.click()">
        @if (avatarPreviewUrl()) {
          <img class="w-full h-full rounded-full object-cover" [src]="avatarPreviewUrl()" alt="프로필 이미지" />
        } @else {
          <span class="font-medium text-[13px] leading-4 text-zinc-200">{{ userInitial() }}</span>
        }
        <div class="absolute inset-0 flex flex-col justify-center items-center gap-3 px-[33px] py-[11px] bg-zinc-800 border border-zinc-600 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-[1]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M8.16406 18.1249C6.26129 17.6943 4.70212 16.7221 3.48656 15.2082C2.27101 13.6943 1.66351 11.9582 1.66406 9.99988C1.66462 8.04154 2.2724 6.30543 3.4874 4.79154C4.7024 3.27765 6.26129 2.30543 8.16406 1.87488C8.42795 1.80543 8.66073 1.85404 8.8624 2.02071C9.06406 2.18738 9.16462 2.4096 9.16406 2.68738C9.16406 2.88182 9.10851 3.05543 8.9974 3.20821C8.88628 3.36099 8.73351 3.45821 8.53906 3.49988C7.01128 3.8471 5.76128 4.62488 4.78906 5.83321C3.81684 7.04154 3.33073 8.43043 3.33073 9.99988C3.33073 11.5693 3.81684 12.9582 4.78906 14.1665C5.76128 15.3749 7.01128 16.1527 8.53906 16.4999C8.73351 16.5415 8.88628 16.6388 8.9974 16.7915C9.10851 16.9443 9.16406 17.1179 9.16406 17.3124C9.16406 17.5902 9.06351 17.8124 8.8624 17.979C8.66128 18.1457 8.42851 18.1943 8.16406 18.1249ZM11.8307 18.1249C11.5668 18.1943 11.3343 18.1457 11.1332 17.979C10.9321 17.8124 10.8313 17.5902 10.8307 17.3124C10.8307 17.1179 10.8863 16.9443 10.9974 16.7915C11.1085 16.6388 11.2613 16.5415 11.4557 16.4999C11.8307 16.4165 12.1955 16.3018 12.5499 16.1557C12.9043 16.0096 13.241 15.8327 13.5599 15.6249C13.7127 15.5138 13.883 15.4721 14.0707 15.4999C14.2585 15.5277 14.4216 15.611 14.5599 15.7499C14.7543 15.9443 14.8377 16.1702 14.8099 16.4274C14.7821 16.6846 14.6571 16.8893 14.4349 17.0415C14.0321 17.2915 13.6118 17.5068 13.1741 17.6874C12.7363 17.8679 12.2885 18.0138 11.8307 18.1249ZM15.7474 14.5832C15.6085 14.4443 15.5252 14.2813 15.4974 14.094C15.4696 13.9068 15.5113 13.7365 15.6224 13.5832C15.8307 13.2638 16.008 12.9235 16.1541 12.5624C16.3002 12.2013 16.4146 11.8332 16.4974 11.4582C16.5391 11.2638 16.6363 11.1146 16.7891 11.0107C16.9418 10.9068 17.1155 10.8546 17.3099 10.854C17.5877 10.854 17.8099 10.9549 17.9766 11.1565C18.1432 11.3582 18.1918 11.5907 18.1224 11.854C18.0113 12.3124 17.8655 12.7604 17.6849 13.1982C17.5043 13.636 17.2891 14.056 17.0391 14.4582C16.8863 14.6804 16.6816 14.8054 16.4249 14.8332C16.1682 14.861 15.9424 14.7777 15.7474 14.5832ZM17.3099 9.16654C17.1155 9.166           </svg>
          <span class="font-medium text-[13px] leading-4 text-white whitespace-nowrap">업로드</span>
        </div>
      </div>
      <input #avatarInput type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden (change)="onAvatarFileChange($event)" />
      @if (avatarError()) {
        <span class="font-suit font-medium text-[13px] leading-[150%] text-red-500">{{ avatarError() }}</span>
      }

      <!-- 폼 필드 -->
      <div class="flex flex-col justify-center items-center gap-6 w-full">
        <!-- 닉네임 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1 h-[42px]">
            <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">닉네임</span>
            <span class="w-1.5 h-1.5 bg-accent rounded-full"></span>
          </div>
          <input class="w-full h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="text" placeholder="입력해주세요." [(value)]="nickname" />
        </div>

        <!-- 연락처 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1 h-[42px]">
            <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">연락처</span>
            <span class="w-1.5 h-1.5 bg-accent rounded-full"></span>
          </div>
          <div class="flex gap-2 w-full">
            <div class="flex justify-between items-center px-3 gap-2 w-[102px] min-w-[102px] h-12 bg-zinc-800 rounded-xl cursor-pointer box-border">
              <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-500">{{ phonePrefix }}</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#71717A">
                <path d="M7 10l5 5 5-5z"/>
              </svg>
            </div>
            <input class="flex-1 h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="text" placeholder="입력해주세요." />
          </div>
        </div>

        <!-- 이메일주소 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1 h-[42px]">
            <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">이메일주소</span>
            <span class="w-1.5 h-1.5 bg-accent rounded-full"></span>
          </div>
          <input class="w-full h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="email" placeholder="입력해주세요." />
        </div>

        <!-- 비밀번호 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1 h-[42px]">
            <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">비밀번호</span>
          </div>
          <input class="w-full h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="password" placeholder="입력해주세요." />
        </div>

        <!-- SNS -->
        <div class="flex flex-col gap-2 w-full">
          <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-white">SNS</span>
          <div class="flex flex-col gap-2">
            <!-- 링크 -->
            <div class="flex items-center gap-2 w-full">
              <div class="flex justify-center items-center w-12 h-12 min-w-[48px] bg-zinc-800 rounded-xl">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#71717A"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
              </div>
              <input class="flex-1 h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="url" placeholder="링크를 입력해주세요." />
            </div>
            <!-- 인스타그램 -->
            <div class="flex items-center gap-2 w-full">
              <div class="flex justify-center items-center w-12 h-12 min-w-[48px] bg-zinc-800 rounded-xl">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#71717A"><path d="M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465.66.254 1.216.598 1.772 1.153a4.908 4.908 0 0 1 1.153 1.772c.247.637.415 1.363.465 2.428.047 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.218 1.79-.465 2.428a4.883 4.883 0 0 1-1.153 1.772 4.915 4.915 0 0 1-1.772 1.153c-.637.247-1.363.415-2.428.465-1.066.047-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.218-2.428-.465a4.89 4.89 0 0 1-1.772-1.153 4.904 4.904 0 0 1-1.153-1.772c-.248-.637-.415-1.363-.465-2.428C2.013 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.066.217-1.79.465-2.428a4.88 4.88 0 0 1 1.153-1.772A4.897 4.897 0 0 1 5.45 2.525c.638-.248 1.362-.415 2.428-.465C8.944 2.013 9.283 2 12 2zm0 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.333a3.333 3.333 0 1 1 0-6.666 3.333 3.333 0 0 1 0 6.666zM18.538 6.462a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>
              </div>
              <input class="flex-1 h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="url" placeholder="링크를 입력해주세요." />
            </div>
            <!-- Twitter/X -->
            <div class="flex items-center gap-2 w-full">
              <div class="flex justify-center items-center w-12 h-12 min-w-[48px] bg-zinc-800 rounded-xl">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#71717A"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              </div>
              <input class="flex-1 h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="url" placeholder="링크를 입력해주세요." />
            </div>
            <!-- 유튜브 -->
            <div class="flex items-center gap-2 w-full">
              <div class="flex justify-center items-center w-12 h-12 min-w-[48px] bg-zinc-800 rounded-xl">
                <svg width="16" height="14" viewBox="0 0 24 18" fill="#71717A"><path d="M23.498 3.174a3.012 3.012 0 0 0-2.12-2.136C19.505.5 12 .5 12 .5s-7.505 0-9.378.538A3.012 3.012 0 0 0 .502 3.174C0 5.065 0 9 0 9s0 3.935.502 5.826a3.012 3.012 0 0 0 2.12 2.136C4.495 17.5 12 17.5 12 17.5s7.505 0 9.378-.538a3.012 3.012 0 0 0 2.12-2.136C24 12.935 24 9 24 9s0-3.935-.502-5.826zM9.545 12.727V5.273L15.818 9l-6.273 3.727z"/></svg>
              </div>
              <input class="flex-1 h-12 px-3 py-2 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" type="url" placeholder="링크를 입력해주세요." />
            </div>
          </div>
        </div>

        <!-- 소개 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1 h-[42px]">
            <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">소개</span>
          </div>
          <textarea class="w-full h-[120px] p-3 bg-zinc-800 border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white outline-none resize-y transition-shadow duration-150 placeholder:text-zinc-500 focus:shadow-[0_0_0_1px_#7A48FF] box-border" placeholder="입력해주세요." rows="5"></textarea>
        </div>
      </div>

      <!-- 버튼 행 -->
      <div class="flex justify-center gap-3 w-full">
        <button class="flex-1 flex justify-center items-center h-12 p-4 bg-zinc-700 border-none rounded-xl cursor-pointer font-suit font-medium text-base leading-[150%] tracking-tight text-white transition-opacity duration-150 hover:opacity-80" (click)="onCancel()">취소</button>
        <button class="flex-1 flex justify-center items-center h-12 p-4 bg-accent border-none rounded-xl cursor-pointer font-suit font-medium text-base leading-[150%] tracking-tight text-white transition-opacity duration-150 hover:opacity-85" (click)="onSave()">저장</button>
      </div>

      <!-- 회원탈퇴 -->
      <div class="flex items-center gap-3 w-full cursor-pointer transition-opacity duration-150 hover:opacity-70" (click)="onWithdraw()">
        <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-600">회원탈퇴</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#52525B">
          <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/>
        </svg>
      </div>
    </div>
  </main>
</div>
