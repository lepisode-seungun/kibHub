<!-- 모바일: 상단 네비게이션 바 -->
<div class="md:hidden flex justify-end items-center px-5 py-[5px] gap-2.5 w-full h-14 bg-[#090909]">
  <div class="flex items-center gap-2.5 flex-1 h-6">
    <button class="flex items-center justify-center w-6 h-6 bg-transparent border-none cursor-pointer p-0" (click)="goBack()" aria-label="뒤로 가기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="#A1A1AA"/>
      </svg>
    </button>
  </div>
</div>

<div class="flex flex-col items-center w-full min-h-screen bg-[#151419]">
  <!-- 메인 콘텐츠 -->
  <div class="flex flex-col items-center px-5 py-5 gap-8 md:px-[100px] md:py-20 md:gap-10 w-full max-w-[1920px] flex-1 box-border pb-[108px] md:pb-20">

    <!-- 데스크톱 타이틀 -->
    <div class="hidden md:flex items-center gap-[172px] w-[500px]">
      <button class="flex items-center justify-center w-6 h-6 bg-transparent border-none cursor-pointer p-0" (click)="goBack()" aria-label="뒤로 가기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="#FFFFFF"/>
        </svg>
      </button>
      <h1 class="font-suit font-bold text-2xl leading-[150%] tracking-tight text-white m-0">비밀번호 변경</h1>
    </div>

    <!-- 모바일 타이틀 -->
    <h1 class="md:hidden font-suit font-bold text-2xl leading-[150%] tracking-tight text-white m-0">비밀번호 변경</h1>

    <!-- 폼 -->
    <div class="flex flex-col items-center gap-6 w-full md:w-[500px]">
      <div class="flex flex-col items-start gap-6 w-full">

        <!-- 현재 비밀번호 -->
        <div class="flex flex-col items-start gap-2 w-full">
          <div class="flex items-center gap-1 w-full h-[42px]">
            <div class="flex items-center gap-1">
              <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">현재 비밀번호</span>
              <span class="w-1.5 h-1.5 bg-[#7A48FF] rounded-full shrink-0"></span>
            </div>
          </div>
          <div class="flex justify-between items-center px-3 gap-2 w-full h-12 bg-zinc-800 rounded-xl box-border">
            <input
              [type]="showCurrentPw() ? 'text' : 'password'"
              class="flex-1 bg-transparent border-none outline-none font-suit font-medium text-base leading-[150%] tracking-tight text-white placeholder:text-zinc-500"
              placeholder="••••••••"
              (input)="onCurrentPwInput($event)"
            />
            <button class="flex items-center justify-center w-5 h-5 bg-transparent border-none cursor-pointer p-0 shrink-0" (click)="toggleCurrentPw()" aria-label="비밀번호 표시">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                @if (showCurrentPw()) {
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#71717A"/>
                } @else {
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="#71717A"/>
                }
              </svg>
            </button>
          </div>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="flex flex-col items-start gap-2 w-full">
          <div class="flex flex-col items-start gap-1">
            <div class="flex items-center gap-1">
              <span class="font-suit font-semibold text-base leading-[150%] tracking-tight text-white">비밀번호 변경</span>
              <span class="w-1.5 h-1.5 bg-[#7A48FF] rounded-full shrink-0"></span>
            </div>
          </div>
          <!-- 새 비밀번호 -->
          <div class="flex justify-between items-center px-3 gap-2 w-full h-12 bg-zinc-800 rounded-xl box-border">
            <input
              [type]="showNewPw() ? 'text' : 'password'"
              class="flex-1 bg-transparent border-none outline-none font-suit font-medium text-base leading-[150%] tracking-tight text-white placeholder:text-zinc-500"
              placeholder="새 비밀번호를 입력해주세요."
              (input)="onNewPwInput($event)"
            />
            <button class="flex items-center justify-center w-5 h-5 bg-transparent border-none cursor-pointer p-0 shrink-0" (click)="toggleNewPw()" aria-label="비밀번호 표시">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                @if (showNewPw()) {
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#71717A"/>
                } @else {
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="#71717A"/>
                }
              </svg>
            </button>
          </div>
          <!-- 비밀번호 확인 -->
          <div class="flex justify-between items-center px-3 gap-2 w-full h-12 bg-zinc-800 rounded-xl box-border">
            <input
              [type]="showConfirmPw() ? 'text' : 'password'"
              class="flex-1 bg-transparent border-none outline-none font-suit font-medium text-base leading-[150%] tracking-tight text-white placeholder:text-zinc-500"
              placeholder="비밀번호를 한번 더 입력해주세요."
              (input)="onConfirmPwInput($event)"
            />
            <button class="flex items-center justify-center w-5 h-5 bg-transparent border-none cursor-pointer p-0 shrink-0" (click)="toggleConfirmPw()" aria-label="비밀번호 표시">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                @if (showConfirmPw()) {
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#71717A"/>
                } @else {
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" fill="#71717A"/>
                }
              </svg>
            </button>
          </div>
          <!-- 비밀번호 일치/불일치 뱃지 -->
          @if (passwordMatch() !== null) {
            <div class="flex items-center gap-1 rounded-md">
              @if (passwordMatch()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="#00E293"/>
                </svg>
                <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-[#00E293]">변경 가능한 비밀번호입니다.</span>
              } @else {
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M4.667 4.667l6.666 6.666M11.333 4.667L4.667 11.333" stroke="#F87171" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-[#F87171]">비밀번호가 일치하지 않습니다.</span>
              }
            </div>
          }
          <!-- 에러 메시지 -->
          @if (passwordError()) {
            <div class="flex items-center gap-1 rounded-md">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4.667 4.667l6.666 6.666M11.333 4.667L4.667 11.333" stroke="#F87171" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-[#F87171]">{{ passwordError() }}</span>
            </div>
          }
        </div>

      </div>

      <!-- 데스크톱: 버튼 그룹 -->
      <div class="hidden md:flex justify-center items-start gap-3 w-full">
        <button
          class="flex justify-center items-center py-3 gap-2.5 w-1/2 h-12 bg-zinc-700 border border-white/[0.12] rounded-xl cursor-pointer box-border transition-opacity duration-150 hover:opacity-85"
          (click)="cancel()"
        >
          <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-white">취소</span>
        </button>
        <button
          class="flex justify-center items-center py-3 gap-1 w-1/2 h-12 bg-[#7A48FF] border-none rounded-xl cursor-pointer transition-opacity duration-150 hover:opacity-85"
          (click)="confirm()"
        >
          <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-white">확인</span>
        </button>
      </div>
    </div>

  </div>

  <!-- 모바일: 하단 고정 버튼 바 -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 flex justify-center items-center px-5 py-5 gap-5 w-full h-[88px] bg-[#151419] border-t border-zinc-800 box-border z-40">
    <button
      class="flex justify-center items-center py-3 gap-2.5 flex-1 h-12 bg-zinc-700 border border-white/[0.12] rounded-xl cursor-pointer box-border transition-opacity duration-150 hover:opacity-85"
      (click)="cancel()"
    >
      <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-white">취소</span>
    </button>
    <button
      class="flex justify-center items-center py-3 gap-1 flex-1 h-12 bg-[#7A48FF] border-none rounded-xl cursor-pointer transition-opacity duration-150 hover:opacity-85"
      (click)="confirm()"
    >
      <span class="font-suit font-bold text-base leading-[150%] tracking-tight text-white">확인</span>
    </button>
  </div>
</div>
