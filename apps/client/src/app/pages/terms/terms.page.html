<main class="flex justify-center items-start min-h-[calc(100vh-72px)] px-5 py-20 bg-gradient-to-br from-bg-primary via-bg-secondary to-bg-tertiary">
  <div class="w-[700px] max-w-full rounded-2xl overflow-hidden drop-shadow-[2px_6px_31px_rgba(0,0,0,0.04)]">
    <div class="flex items-center p-8 bg-bg-card">
      <h1 class="font-suit font-bold text-xl leading-[150%] tracking-tight text-white m-0">서비스 약관</h1>
    </div>
    <div class="p-8 bg-bg-card min-h-[300px]">
      @if (isLoading()) {
        <div class="flex justify-center items-center py-10">
          <svg class="w-8 h-8 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="#7A48FF" stroke-width="4"></circle>
            <path class="opacity-75" fill="#7A48FF" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      } @else if (termsContent()) {
        <p class="font-suit font-medium text-base leading-[180%] tracking-tight text-zinc-400 m-0 whitespace-pre-wrap">{{ termsContent() }}</p>
      } @else {
        <p class="font-suit font-medium text-base leading-[180%] tracking-tight text-zinc-400 m-0">서비스 약관 내용이 등록되지 않았습니다.</p>
      }
    </div>
  </div>
</main>
