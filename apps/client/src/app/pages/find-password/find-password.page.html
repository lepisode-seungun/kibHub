<main class="flex w-full h-screen bg-[#202020] overflow-hidden">
  <!-- Left Panel - Branding -->
  <div class="login-left">
    <div class="sphere sphere-sm-logo"></div>
    <div class="sphere sphere-lg"></div>
    <div class="sphere sphere-md"></div>
    <div class="sphere sphere-sm"></div>
    <div class="left-gradient-bottom"></div>
    <div class="absolute left-[75px] top-[270px] z-[2] flex flex-col gap-[50px]">
      <div>
        <img src="/icons/kiphub-logo.svg" alt="KIPhub" class="h-11 brightness-0 invert" />
      </div>
      <div class="flex flex-col gap-1">
        <span class="font-['Prompt'] font-medium text-[21.6px] leading-[33px] tracking-tight text-[#E9E9E9]">Craft stories, create value.</span>
        <span class="font-['Prompt'] font-light text-[21.6px] leading-[33px] tracking-tight text-[#E9E9E9]/70">from growth to success for<br>webtoon creators.</span>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="find-pw-right flex-1 flex flex-col justify-center items-center bg-white rounded-l-[40px] relative overflow-y-auto max-[960px]:rounded-none">
    <!-- Mobile header -->
    <div class="find-pw-mobile-header">
      <button class="find-pw-back-btn" aria-label="뒤로" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 19l-7-7 7-7" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <!-- Top nav (desktop) -->
    <div class="flex justify-between items-center w-full px-10 py-2.5 absolute top-0 left-0 z-[5] box-border">
      <div>
        <img src="/icons/kiphub-logo.svg" alt="KIPhub" class="h-8" />
      </div>
      <div class="flex items-center gap-1 cursor-pointer">
        <span class="font-suit font-bold text-sm leading-6 text-zinc-800">KR</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M7 10l5 5 5-5" stroke="#27272A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- Form -->
    <div class="flex flex-col items-center gap-6 w-[500px] max-[960px]:w-[90%] max-[960px]:max-w-[500px] max-[960px]:px-5">
      <h1 class="font-suit font-bold text-[28px] leading-[150%] tracking-tight text-zinc-800 text-center m-0">비밀번호 찾기</h1>

      <div class="flex flex-col gap-6 w-full">
        <!-- 안내 문구 -->
        <p class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-600 text-center m-0">
          가입하신 이메일 주소를 입력해 주세요. 이메일 주소로 비밀번호를 <span class="text-accent">재설정할 수 있는<br>이메일을 보내드립니다.</span> 발송된 이메일의 비밀번호 재설정은 10분 간 유효합니다.
        </p>

        <!-- 이메일 -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex items-center gap-1">
            <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-800">이메일</span>
            <span class="w-1.5 h-1.5 bg-accent rounded-full"></span>
          </div>
          <input type="email" class="w-full h-12 px-3 py-2 border border-zinc-200 rounded-xl font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-800 outline-none transition-colors duration-200 placeholder:text-zinc-400 focus:border-accent box-border" placeholder="입력해주세요." (input)="onEmailInput($event)" />
        </div>
      </div>

      @if (successMessage()) {
        <div class="flex items-center gap-2 w-full px-4 py-3 bg-green-50 border border-green-200 rounded-xl">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#16A34A"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-green-700">{{ successMessage() }}</span>
        </div>
      }
      @if (errorMessage()) {
        <div class="flex items-center gap-2 w-full px-4 py-3 bg-red-50 border border-red-200 rounded-xl">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#DC2626"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-red-600">{{ errorMessage() }}</span>
        </div>
      }

      <!-- Submit -->
      <button class="w-full h-12 bg-accent border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white cursor-pointer transition-all duration-200 hover:bg-[#6B3CE6] active:scale-[0.99]" [disabled]="isSubmitting()" (click)="onFindPassword()">{{ isSubmitting() ? '발송 중...' : '메일 발송' }}</button>

      <!-- 이메일 템플릿 미리보기 (개발용) -->
      <button class="w-full h-10 bg-transparent border border-zinc-300 rounded-xl font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-500 cursor-pointer transition-all duration-200 hover:bg-zinc-100" onclick="window.open('/api/auth/preview-reset-email', '_blank')">📧 이메일 템플릿 미리보기</button>
    </div>
  </div>
</main>
