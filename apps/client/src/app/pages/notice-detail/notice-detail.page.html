<div class="flex flex-col">
  <!-- ===== 탭 네비게이션 ===== -->
  <nav class="nd-tab-nav">
    <div class="flex">
      @for (tab of detailTabs; track tab) {
        <button
          [ngClass]="activeDetailTab() === tab ? 'nd-tab-item nd-tab-item-active' : 'nd-tab-item'"
          (click)="selectDetailTab(tab)">
          {{ tab }}
        </button>
      }
    </div>
  </nav>

  <!-- ===== 메인 ===== -->
  <main class="nd-page">
    <div class="flex flex-col items-center gap-6 w-full max-w-[1400px]">
      <!-- 제목 행 -->
      <div class="flex items-center gap-2 w-full">
        @if (isPinned) {
          <svg class="shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="#7A48FF">
            <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/>
          </svg>
        }
        <div class="flex justify-between items-end gap-6 flex-1">
          <span class="font-suit font-bold text-lg leading-[150%] tracking-tight text-zinc-800">{{ noticeTitle }}</span>
          <span class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-500 shrink-0">{{ noticeDate }}</span>
        </div>
      </div>

      <!-- 구분선 -->
      <hr class="w-full border-none border-t border-zinc-100" />

      <!-- 본문 -->
      <div class="flex flex-col gap-6 w-full">
        <p class="font-suit font-medium text-base leading-[160%] tracking-tight text-zinc-500 m-0">{{ noticeContent }}</p>
        <div class="w-[456px] h-[504px] bg-gradient-to-br from-zinc-100 to-zinc-200 rounded-xl nd-image-responsive"></div>
      </div>

      <!-- 첨부파일 -->
      <div class="nd-attach-files flex flex-wrap items-start gap-6 w-full max-w-[1400px]">
        @for (file of attachFiles; track file.name) {
          <div class="flex items-center px-3 py-2 gap-3 max-w-[296px] bg-white border border-gray-100 rounded-full transition-colors duration-150 hover:border-zinc-300 box-border">
            <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-700 whitespace-nowrap overflow-hidden text-ellipsis flex-1">{{ file.name }}</span>
            <button class="flex items-center justify-center w-5 h-5 bg-transparent border-none cursor-pointer p-0 shrink-0 transition-transform duration-150 hover:translate-y-0.5" aria-label="다운로드">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M12 4v12M12 16l-4-4M12 16l4-4" stroke="#7A48FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 20h14" stroke="#7A48FF" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        }
      </div>
      <!-- 목록 버튼 -->
      <div class="flex justify-center w-full mt-10">
        <button class="flex justify-center items-center w-[300px] h-12 px-3 py-2 border border-zinc-300 rounded-xl bg-white cursor-pointer font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-700 transition-all duration-150 hover:bg-zinc-50 hover:border-zinc-400 active:scale-[0.98] box-border" (click)="goToList()">목록으로</button>
      </div>
    </div>
  </main>
</div>
