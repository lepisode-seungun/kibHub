<main class="w-full min-h-screen bg-[#09090B]">
  <!-- 히어로 배너 (데스크톱) -->
  <section class="kd-hero kd-hero--desktop" id="kd-hero">
    <div class="flex items-center justify-center z-[1]">
      <h1 class="kd-hero-title font-bold text-[32px] leading-[150%] text-center tracking-tight m-0 -mt-5"
          style="font-family: 'Gmarket Sans TTF', sans-serif; background: linear-gradient(180deg, #ECEFEF 0%, #FFFFFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">{{ heroTitle }}</h1>
    </div>
    <p class="kd-hero-subtitle font-medium text-[18px] leading-[150%] text-center tracking-tight text-[#D9D9D9] mt-6 z-[1]"
       style="font-family: 'Gmarket Sans TTF', sans-serif;">{{ heroSubtitle }}</p>
  </section>

  <!-- 히어로 배너 (모바일) -->
  <section class="kd-hero--mobile" id="kd-hero-mobile">
    <img class="kd-hero-mobile-bg" src="/images/kd-hero-bg-mobile.svg" alt="" aria-hidden="true">
    <div class="kd-hero-mobile-overlay">
      <div class="kd-hero-mobile-box">
        <h1 class="kd-hero-mobile-title" style="font-family: 'Gmarket Sans TTF', sans-serif;">{{ heroTitle }}</h1>
      </div>
      <p class="kd-hero-mobile-subtitle" style="font-family: 'Gmarket Sans TTF', sans-serif;">{{ heroSubtitle }}</p>
    </div>
  </section>

  <!-- 부트캠프 카드 그리드 -->
  <section class="kd-grid-section" id="kd-grid">
    <div class="flex items-center gap-10">
      <h2 class="font-suit font-bold text-2xl leading-[150%] tracking-tight text-white m-0 flex-1">부트캠프</h2>
    </div>

    <!-- 동적 그리드 -->
    <div class="kd-grid">
      @for (card of bootcampCards(); track card.id) {
        <a class="kd-card" [routerLink]="['/k-digital', card.id]">
          @if (card.thumbnailUrl) {
            <div class="kd-thumb">
              <img [src]="card.thumbnailUrl" alt="" class="w-full h-full object-cover" />
            </div>
          } @else {
            <div class="kd-thumb" [style.background]="card.thumbnailGradient"></div>
          }
          <div class="flex flex-col gap-3 px-1">
            <div class="flex gap-1.5 items-center">
              <span class="kd-status-badge"
                [ngClass]="{
                  'kd-status--preparing': card.status === 'preparing',
                  'kd-status--recruiting': card.status === 'recruiting',
                  'kd-status--operating': card.status === 'operating',
                  'kd-status--closed': card.status === 'closed',
                  'kd-status--ended': card.status === 'ended'
                }">{{ card.statusText }}</span>
              @if (card.deadline) {
                <span class="flex items-center justify-center px-2 py-0.5 border border-zinc-500 rounded-md font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-300">{{ card.deadline }}</span>
              }
            </div>
            <h3 class="font-suit font-bold text-lg leading-[150%] tracking-tight text-white m-0">{{ card.name }}</h3>
            <p class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-400 m-0">{{ card.summary }}</p>
          </div>
        </a>
      }
    </div>

    <!-- 무한 스크롤 센티널 + 로딩 스피너 -->
    <div #scrollSentinel class="flex flex-col justify-center items-center py-10 w-full" style="min-height: 60px;">
      @if (isLoading()) {
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
          <rect width="10" height="10" x="1" y="1" fill="#7A48FF" rx="1">
            <animate id="kd1" fill="freeze" attributeName="x" begin="0;kd12.end" dur="0.2s" values="1;13"/>
            <animate id="kd2" fill="freeze" attributeName="y" begin="kd4.end" dur="0.2s" values="1;13"/>
            <animate id="kd3" fill="freeze" attributeName="x" begin="kd7.end" dur="0.2s" values="13;1"/>
            <animate id="kd4b" fill="freeze" attributeName="y" begin="kd10.end" dur="0.2s" values="13;1"/>
          </rect>
          <rect width="10" height="10" x="1" y="13" fill="#7A48FF" rx="1">
            <animate id="kd5" fill="freeze" attributeName="y" begin="kd1.end" dur="0.2s" values="13;1"/>
            <animate id="kd6" fill="freeze" attributeName="x" begin="kd2.end" dur="0.2s" values="1;13"/>
            <animate id="kd7b" fill="freeze" attributeName="y" begin="kd3.end" dur="0.2s" values="1;13"/>
            <animate id="kd8" fill="freeze" attributeName="x" begin="kd4b.end" dur="0.2s" values="13;1"/>
          </rect>
          <rect width="10" height="10" x="13" y="13" fill="#7A48FF" rx="1">
            <animate id="kd4" fill="freeze" attributeName="x" begin="kd5.end" dur="0.2s" values="13;1"/>
            <animate id="kd7" fill="freeze" attributeName="y" begin="kd6.end" dur="0.2s" values="13;1"/>
            <animate id="kd10" fill="freeze" attributeName="x" begin="kd7b.end" dur="0.2s" values="1;13"/>
            <animate id="kd12" fill="freeze" attributeName="y" begin="kd8.end" dur="0.2s" values="1;13"/>
          </rect>
        </svg>
      }
    </div>
  </section>
</main>
