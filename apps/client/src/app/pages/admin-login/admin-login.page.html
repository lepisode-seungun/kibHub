<div class="adm-screen">
  <!-- ===== 상단 타이틀 바 ===== -->
  <div class="adm-title-bar">
    <div class="adm-title-inner">
      <!-- 좌: 로그인 -->
      <span class="adm-title-text">로그인</span>
      <!-- 우: 권한 / 역할 -->
      <div class="adm-title-right">
        <span class="adm-role-label">{{ roleLabel }}</span>
        <span class="adm-role-name">{{ roleName }}</span>
      </div>
    </div>
  </div>

  <!-- ===== 로그인 영역 ===== -->
  <div class="adm-body">
    <div class="adm-form-card">
      <!-- 아이콘 -->
      <div class="adm-icon-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M11 17a2.5 2.5 0 010-5 2.5 2.5 0 010 5zm0 2c1.61 0 2.91 1.3 2.91 2.91V22H8.09v-.09C8.09 20.3 9.39 19 11 19zM5.12 14H3V9c0-1.1.9-2 2-2h2v2H5v3h.12L5.12 14zM17 7h2c1.1 0 2 .9 2 2v5h-2.12l.12-2H17V7zm-4-5c1.1 0 2 .9 2 2v2h-2V4h-2v2H9V4c0-1.1.9-2 2-2h2z" fill="#FFFFFF"/>
        </svg>
      </div>

      <!-- 타이틀 -->
      <h2 class="adm-form-title">로그인</h2>

      <!-- 아이디 -->
      <div class="adm-field">
        <div class="adm-label-wrap">
          <label class="adm-label" for="admin-login-id">아이디</label>
        </div>
        <div class="adm-input-wrap">
          <input
            id="admin-login-id"
            type="text"
            class="adm-input"
            placeholder="아이디를 입력해주세요"
            [value]="email"
            (input)="onEmailInput($event)"
            (keydown.enter)="onLogin()"
          />
        </div>
      </div>

      <!-- 비밀번호 -->
      <div class="adm-field">
        <div class="adm-label-wrap">
          <label class="adm-label" for="admin-login-pw">비밀번호</label>
        </div>
        <div class="adm-input-wrap">
          <input
            id="admin-login-pw"
            type="password"
            class="adm-input"
            placeholder="비밀번호를 입력해주세요"
            [value]="password"
            (input)="onPasswordInput($event)"
            (keydown.enter)="onLogin()"
          />
        </div>
      </div>

      <!-- 자동 로그인 -->
      <div class="adm-checkbox-row" (click)="toggleAutoLogin()" role="checkbox" [attr.aria-checked]="autoLogin()" tabindex="0" (keydown.enter)="toggleAutoLogin()" (keydown.space)="toggleAutoLogin(); $event.preventDefault()">
        <div class="adm-checkbox" [class.adm-checkbox-checked]="autoLogin()">
          @if (autoLogin()) {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
          }
        </div>
        <span class="adm-checkbox-text">자동 로그인</span>
      </div>

      <!-- 에러 메시지 -->
      @if (showError()) {
        <span class="adm-error">아이디 또는 비밀번호가 올바르지 않습니다.</span>
      }

      <!-- 로그인 버튼 -->
      <button class="adm-submit-btn" (click)="onLogin()">로그인</button>
    </div>
  </div>
</div>
