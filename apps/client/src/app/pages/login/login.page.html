<main class="flex w-full h-screen bg-[#202020] overflow-hidden">
  <!-- Left Panel - Branding -->
  <div class="login-left">
    <div class="sphere sphere-sm-logo"></div>
    <div class="sphere sphere-lg"></div>
    <div class="sphere sphere-md"></div>
    <div class="sphere sphere-sm"></div>
    <div class="absolute left-[75px] top-[270px] z-[2] flex flex-col gap-[50px]">
      <div>
        <img src="/icons/kiphub-logo.svg" alt="KIPhub" class="h-11 brightness-0 invert" />
      </div>
      <div class="flex flex-col gap-1">
        <span class="font-['Prompt'] font-medium text-[21.6px] leading-[33px] tracking-tight text-[#E9E9E9]">Craft stories, create value.</span>
        <span class="font-['Prompt'] font-light text-[21.6px] leading-[33px] tracking-tight text-[#E9E9E9]/70">from growth to success for<br>webtoon creators.</span>
      </div>
    </div>
    <div class="left-gradient-bottom"></div>
  </div>

  <!-- Right Panel - Login Form -->
  <div class="flex-1 flex flex-col justify-center items-center bg-white rounded-l-[40px] relative overflow-y-auto max-[960px]:rounded-none">
    <!-- Top nav -->
    <div class="flex justify-between items-center w-full px-10 py-2.5 absolute top-0 left-0 z-[5] box-border">
      <div><img src="/icons/kiphub-logo.svg" alt="KIPhub" class="h-8" /></div>
      <div class="flex items-center gap-1 cursor-pointer">
        <span class="font-suit font-bold text-sm leading-6 text-zinc-800">KR</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 10l5 5 5-5" stroke="#27272A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- Form Container -->
    <div class="flex flex-col items-center gap-6 w-[500px] max-[960px]:w-[90%] max-[960px]:max-w-[500px] max-[960px]:px-5">
      <h1 class="font-suit font-bold text-[28px] leading-[150%] tracking-tight text-zinc-800 text-center m-0">로그인</h1>

      <div class="flex flex-col gap-6 w-full">
        <!-- Email -->
        <div class="flex flex-col gap-2 w-full">
          <label class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-800" for="login-email">이메일</label>
          <input id="login-email" type="email" class="w-full h-12 px-3 py-2 border border-zinc-200 rounded-xl font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-800 outline-none transition-colors duration-200 placeholder:text-zinc-400 focus:border-accent box-border" placeholder="입력해주세요." (input)="onEmailInput($event)" (keydown.enter)="onLogin()" />
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-2 w-full">
          <div class="flex flex-col gap-2">
            <div class="flex items-center gap-1">
              <label class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-800" for="login-password">비밀번호</label>
              <span class="tooltip-wrap" data-tooltip="비밀번호는 영문, 숫자, 특수문자를 포함하여 8자 이상으로 입력해주세요.">
                <svg class="help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
              </span>
            </div>
            <input id="login-password" type="password" class="w-full h-12 px-3 py-2 border border-zinc-200 rounded-xl font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-800 outline-none transition-colors duration-200 placeholder:text-zinc-400 focus:border-accent box-border" placeholder="입력해주세요." (input)="onPasswordInput($event)" (keydown.enter)="onLogin()" />
          </div>
          @if (showPasswordError()) {
            <div class="flex items-center gap-1">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#F87171" stroke-width="2" stroke-linecap="round"/></svg>
              <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-red-400">비밀번호 불일치</span>
            </div>
          }
        </div>
      </div>

      <!-- Options -->
      <div class="flex justify-between items-center w-full">
        <div class="flex items-center gap-2">
          <button [ngClass]="autoLogin() ? 'checkbox-btn checked' : 'checkbox-btn'" (click)="toggleAutoLogin()">
            @if (autoLogin()) {
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#7A48FF"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            }
          </button>
          <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-500">자동로그인</span>
        </div>
        <div class="flex items-center gap-3">
          <a class="no-underline font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-400 transition-colors duration-150 hover:text-zinc-600" routerLink="/find-email">이메일 찾기</a>
          <a class="no-underline font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-400 transition-colors duration-150 hover:text-zinc-600" routerLink="/find-password">비밀번호 찾기</a>
        </div>
      </div>

      <!-- Login Button -->
      <div class="flex flex-col items-center gap-4 w-full">
        <button class="w-full h-12 bg-accent border-none rounded-xl font-suit font-medium text-base leading-[150%] tracking-tight text-white cursor-pointer transition-all duration-200 hover:bg-[#6B3CE6] active:scale-[0.99]" (click)="onLogin()">이메일로 로그인</button>
        <div class="flex items-center gap-2">
          <span class="font-suit font-medium text-sm leading-[150%] tracking-tight text-zinc-400">계정이 없으신가요?</span>
          <a class="no-underline font-suit font-bold text-sm leading-[150%] tracking-tight text-accent transition-opacity duration-150 hover:opacity-80" routerLink="/signup">회원가입 하기</a>
        </div>
      </div>

      <!-- Terms -->
      <p class="font-suit font-medium text-xs leading-[150%] tracking-tight text-zinc-300 text-center m-0">회원가입 하시면 KIPhub 이용약관, 개인정보 수집 및 이용에 동의하신것으로 간주합니다</p>
    </div>
  </div>
</main>
