<main class="login-page">
  <!-- Left Panel - Branding -->
  <div class="login-left">
    <div class="sphere sphere-sm-logo"></div>
    <div class="sphere sphere-lg"></div>
    <div class="sphere sphere-md"></div>
    <div class="sphere sphere-sm"></div>
    <div class="left-gradient-bottom"></div>
    <div class="left-content">
      <div class="left-logo">
        <img src="/icons/kiphub-logo.svg" alt="KIPhub" class="left-logo-img" />
      </div>
      <div class="left-tagline">
        <span class="tagline-line1">Craft stories, create value.</span>
        <span class="tagline-line2">from growth to success for<br>webtoon creators.</span>
      </div>
    </div>
  </div>

  <!-- Right Panel - Signup Form -->
  <div class="signup-right">
    <div class="signup-form-wrap">
      <h1 class="signup-heading">회원가입</h1>

      <!-- Profile Photo -->
      <div class="profile-upload">
        <div class="profile-circle">
          <span class="profile-initial">N</span>
        </div>
      </div>

      <!-- Form Fields -->
      <div class="signup-fields">
        <!-- 이메일 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">이메일</span>
            <span class="required-dot"></span>
            <span class="tooltip-wrap" data-tooltip="이메일은 본인에게만 노출되며, 로그인 시 사용되니 신중하게 작성해주세요.">
              <svg class="help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </span>
          </div>
          <div class="input-with-btn">
            <input type="email" class="form-input form-input-flex" placeholder="입력해주세요." (input)="onInput('email', $event)" />
            <button class="verify-btn">인증</button>
          </div>
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">비밀번호</span>
            <span class="required-dot"></span>
            <span class="tooltip-wrap" data-tooltip="비밀번호는 영문, 숫자, 특수문자를 포함하여 8자 이상으로 입력해주세요.">
              <svg class="help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </span>
          </div>
          <input type="password" class="form-input" placeholder="입력해주세요." (input)="onInput('password', $event)" />
        </div>

        <!-- 비밀번호 확인 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">비밀번호 확인</span>
            <span class="required-dot"></span>
          </div>
          <input type="password" class="form-input" placeholder="입력해주세요." (input)="onInput('passwordConfirm', $event)" />
        </div>

        <!-- 이름 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">이름</span>
            <span class="required-dot"></span>
          </div>
          <input type="text" class="form-input" placeholder="입력해주세요." (input)="onInput('name', $event)" />
        </div>

        <!-- 연락처 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">연락처</span>
            <span class="required-dot"></span>
            <span class="tooltip-wrap" data-tooltip="연락처는 본인에게만 노출되며, 비밀번호 찾기에 활용되니 신중하게 작성해주세요.">
              <svg class="help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </span>
          </div>
          <div class="input-with-dropdown">
            <div class="country-select" role="button" tabindex="0" (click)="toggleCountryDropdown()" (keydown.enter)="toggleCountryDropdown()">
              <span class="country-code">{{ countryCode() }}</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#A1A1AA">
                <path d="M7 10l5 5 5-5z"/>
              </svg>
              @if (showCountryDropdown()) {
                <div class="country-dropdown">
                  @for (code of countryCodes; track code) {
                    <button class="country-option" (click)="selectCountryCode(code); $event.stopPropagation()">{{ code }}</button>
                  }
                </div>
              }
            </div>
            <input type="tel" class="form-input form-input-phone" placeholder="입력해주세요." (input)="onInput('phone', $event)" />
          </div>
        </div>

        <!-- 생년월일 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">생년월일</span>
            <span class="required-dot"></span>
            <span class="tooltip-wrap" data-tooltip="생년월일은 본인에게만 노출되며, 본인 확인에 활용되니 정확하게 작성해주세요.">
              <svg class="help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
            </span>
          </div>
          <input type="date" class="form-input" (input)="onInput('birthday', $event)" />
        </div>

        <!-- 닉네임 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">닉네임</span>
            <span class="required-dot"></span>
          </div>
          <input type="text" class="form-input" placeholder="입력해주세요." (input)="onInput('nickname', $event)" />
        </div>

        <!-- 소개 -->
        <div class="form-group">
          <div class="form-label-row">
            <span class="form-label">소개</span>
          </div>
          <input type="text" class="form-input" placeholder="입력해주세요." (input)="onInput('intro', $event)" />
        </div>
      </div>

      <!-- Terms -->
      <div class="signup-terms-section">
        <div class="terms-check-row">
          <button class="terms-checkbox" (click)="toggleTerms()">
            @if (agreeTerms()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#A1A1AA"/>
                <path d="M9.5 15.5L6 12l-1 1 4.5 4.5 9-9-1-1z" fill="#FFFFFF"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" stroke="#A1A1AA" stroke-width="1.5" fill="none"/>
              </svg>
            }
          </button>
          <div class="terms-text-col">
            <div class="terms-main">
              <span class="terms-required">[필수]</span>
              <span class="terms-label">서비스 이용약관 및 개인정보 처리 방침 동의</span>
            </div>
            <div class="terms-links">
              <a class="terms-link" routerLink="/">개인정보처리방침 <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
              <a class="terms-link" routerLink="/">이용약관 <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
            </div>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button class="signup-btn" (click)="onSignup()">회원가입</button>
    </div>
  </div>
</main>
