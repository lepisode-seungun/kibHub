<main class="flex justify-center items-start min-h-[calc(100vh-72px)] px-5 py-20 md:px-4 md:py-10 bg-gradient-to-br from-bg-primary via-bg-secondary to-bg-tertiary">
  <div class="flex flex-col w-[700px] max-w-full drop-shadow-[2px_6px_31px_rgba(0,0,0,0.04)] rounded-2xl overflow-hidden">
    <!-- Header -->
    <div class="flex items-center px-8 pt-8 bg-bg-card max-md:px-4">
      <h1 class="font-suit font-bold text-xl leading-[150%] tracking-tight text-white m-0">개인정보 처리방침</h1>
    </div>

    <!-- Body -->
    <div class="flex flex-col items-center p-8 gap-6 bg-bg-card shadow-[2px_6px_31px_rgba(0,0,0,0.04)] min-h-[248px] max-md:px-4 max-md:py-6">
      @if (isLoading()) {
        <div class="flex justify-center items-center py-10 w-full">
          <svg class="w-8 h-8 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="#7A48FF" stroke-width="4"></circle>
            <path class="opacity-75" fill="#7A48FF" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      } @else if (privacyContent()) {
        <div class="flex flex-col w-full gap-3">
          <!-- 제목 -->
          <div class="font-suit font-bold text-lg leading-[150%] tracking-tight text-white">개인정보 수집 및 이용에 관한 동의 (필수)</div>

          <!-- 스크롤 영역 -->
          <div class="relative w-full h-[600px] max-md:h-[400px] bg-zinc-800 rounded-lg overflow-hidden">
            <div class="flex flex-col gap-6 p-4 h-full overflow-y-auto scrollbar-thin scrollbar-track-[#8D8D8D] scrollbar-thumb-zinc-200">
              <p class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-500 m-0 whitespace-pre-wrap">{{ privacyContent() }}</p>
            </div>
          </div>
        </div>
      } @else {
        <div class="flex flex-col w-full gap-3">
          <div class="font-suit font-bold text-lg leading-[150%] tracking-tight text-white">개인정보 수집 및 이용에 관한 동의 (필수)</div>
          <div class="relative w-full h-[600px] max-md:h-[400px] bg-zinc-800 rounded-lg overflow-hidden">
            <div class="flex flex-col gap-6 p-4 h-full overflow-y-auto">
              <p class="font-suit font-medium text-base leading-[150%] tracking-tight text-zinc-500 m-0">개인정보 처리방침 내용이 등록되지 않았습니다.</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</main>
