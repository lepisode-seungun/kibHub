<div class="upload-overlay" (click)="close()"></div>
<div class="upload-modal">
  <!-- 헤더 -->
  <div class="upload-header">
    <div class="upload-header-left">
      <h2 class="upload-title">콘텐츠 등록</h2>
      <svg class="upload-help-icon" width="18" height="18" viewBox="0 0 24 24" fill="#A1A1AA">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
      </svg>
    </div>
    <button class="upload-close-btn" aria-label="닫기" (click)="close()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#71717A">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <!-- 카드 영역 -->
  <div class="upload-body">
    <div class="upload-cards">
      <!-- 웹툰 -->
      <button class="upload-card" (click)="selectType('webtoon')">
        <div class="upload-card-bg upload-card-webtoon">
          <div class="card-ellipse card-ellipse-lg"></div>
          <div class="card-ellipse card-ellipse-sm"></div>
          <div class="card-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" opacity="0.5"/>
              <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
              <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm2 4v-2H3a2 2 0 002 2zM3 9h2V7H3v2zm12 12h2v-2h-2v2zm4-18a2 2 0 00-2 2h2v2h2V5a2 2 0 00-2-2zm0 14h2v-2h-2v2zm0-8h2V7h-2v2zm0 4h2v-2h-2v2zM7 21h2v-2H7v2zM19 3H5v2h14V3zm-4 18h2v-2h-2v2zM3 5a2 2 0 00-2 2h2V5z" opacity="0"/>
            </svg>
            <span class="card-label">웹툰</span>
          </div>
        </div>
      </button>

      <!-- 그림 -->
      <button class="upload-card" (click)="selectType('image')">
        <div class="upload-card-bg upload-card-image">
          <div class="card-ellipse card-ellipse-lg"></div>
          <div class="card-ellipse card-ellipse-sm"></div>
          <div class="card-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
            </svg>
            <span class="card-label">그림</span>
          </div>
        </div>
      </button>

      <!-- 글 -->
      <button class="upload-card" (click)="selectType('text')">
        <div class="upload-card-bg upload-card-text">
          <div class="card-ellipse card-ellipse-lg"></div>
          <div class="card-ellipse card-ellipse-sm"></div>
          <div class="card-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 20V4h5v5a2 2 0 002 2h5v9H6z"/>
            </svg>
            <span class="card-label">글</span>
          </div>
        </div>
      </button>
    </div>
  </div>
</div>
