version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiphub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiphub
      POSTGRES_PASSWORD: kiphub1234
      POSTGRES_DB: kiphub
    ports:
      - '5440:5432'
    volumes:
      - kiphub_pgdata:/var/lib/postgresql/data

volumes:
  kiphub_pgdata:
